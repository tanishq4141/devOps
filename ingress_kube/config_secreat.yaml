apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "Development"
  WELCOME_MSG: "Hello from the Kubernetes ConfigMap!"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # stringData allows plain text entry; K8s automatically base64-encodes it.
  DB_PASSWORD: "SuperSecretPassword123"

